name: BigTrap2 NQ Sweep Contract

on:
  push:
    paths:
      - 'tools/sweep_bigtrap2_nq_tickframes*.py'
      - 'edgelab/bridge/indicators/bigtrap2_creation_only.py'
      - 'specs/bigtrap2_nq_tickframes_sweep*.json'
      - 'specs/kaggle_bigtrap2_nq_tickframes_sweep*.json'
      - 'docs/research/bigtrap2_nq_tickframes_sweep*.json'
      - 'tests/research/test_bigtrap2_nq_tickframes_sweep.py'
      - '.github/workflows/bt2_nq_sweep.yml'
  pull_request:
    paths:
      - 'tools/sweep_bigtrap2_nq_tickframes*.py'
      - 'edgelab/bridge/indicators/bigtrap2_creation_only.py'
      - 'specs/bigtrap2_nq_tickframes_sweep*.json'
      - 'specs/kaggle_bigtrap2_nq_tickframes_sweep*.json'
      - 'docs/research/bigtrap2_nq_tickframes_sweep*.json'
      - 'tests/research/test_bigtrap2_nq_tickframes_sweep.py'
      - '.github/workflows/bt2_nq_sweep.yml'

jobs:
  bt2-nq-sweep-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/core-bridge-dev.lock

      - name: Run BigTrap2 NQ Kaggle contract tests
        run: pytest tests/research/test_bigtrap2_nq_tickframes_sweep.py -v
