<!doctype html><html lang="es"><head><meta charset="utf-8"><title>EdgeLab · Corredores HFT certificados</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body{margin:0;height:100%;background:#0d131b;color:#dce6f2;font:13px Segoe UI,Arial}header{height:48px;display:flex;align-items:center;gap:10px;padding:0 12px;background:#182230;border-bottom:1px solid #34465d}label{display:flex;gap:5px;align-items:center}input{width:76px;background:#202d3d;color:#fff;border:1px solid #52647c;border-radius:4px;padding:4px}.grow{flex:1}.warn{color:#ffc857;font-weight:700}#wrap{position:relative;height:calc(100% - 49px)}canvas{width:100%;height:100%}.hud{position:absolute;top:10px;left:10px;background:#101923e8;border:1px solid #465a74;padding:9px;white-space:pre;font:12px Consolas,monospace}.error{padding:40px;color:#ff7777}</style></head><body><header><b>Corredores HFT causales</b><span class="warn">PREHOLDOUT · SIN OUTCOMES · VOLUMEN POR NIVEL BLOQUEADO</span><label>σ <input id="sigma" type="number" value="2" step="0.5"></label><label>Hmin <input id="hmin" type="number" value="8"></label><label>Hmax <input id="hmax" type="number" value="32"></label><label>Half-life h <input id="half" type="number" value="12"></label><label>tRef <input id="tref" type="range" min="0" max="1000" value="650"></label><span class="grow"></span><button id="zin">Zoom +</button><button id="zout">Zoom −</button></header><div id="wrap"><canvas id="chart"></canvas><div class="hud" id="hud"></div></div><script src="hft_nq_bundle_certified.js"></script><script src="corridor_engine.js"></script><script>(()=>{'use strict';const B=window.HFT_NQ_CORRIDOR_BUNDLE,E=window.EdgeLabCorridorEngine,wrap=document.querySelector('#wrap'),canvas=document.querySelector('#chart'),hud=document.querySelector('#hud');if(!B||!E){wrap.innerHTML='<div class="error">Falta el bundle certificado. Ejecutá tools/build_hft_corridor_bundle_from_sqlite.py.</div>';return}let zoom=1,last=null;function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return(h>>>0).toString(16).padStart(8,'0')}function fit(){const r=canvas.getBoundingClientRect(),q=devicePixelRatio||1;canvas.width=r.width*q;canvas.height=r.height*q;const x=canvas.getContext('2d');x.setTransform(q,0,0,q,0,0);return{x,w:r.width,h:r.height}}function compute(){const times=B.candles.map(c=>+c.time_ns),i=Math.min(times.length-1,Math.floor((+tref.value/1000)*(times.length-1))),asOf=times[i],config={sigmaTicks:+sigma.value,halfLifeHours:+half.value,decay:true},f=E.field({zones:B.zones,candles:B.candles,asOf,tickSize:+B.meta.tick_size,config}),cs=E.corridors(f,+hmin.value,+hmax.value,.25),canonical=E.canonicalState(f,cs);last={field:f,corridors:cs,canonical,economicHash:hash(canonical)};window.__EDGELAB_CORRIDOR_STATE__=last}function draw(){if(!last)compute();const A=fit(),ctx=A.x;ctx.fillStyle='#0d131b';ctx.fillRect(0,0,A.w,A.h);const f=last.field,cs=last.corridors,tick=+B.meta.tick_size,prices=B.candles.filter(c=>+c.time_ns<=f.asOf).map(c=>+c.price),mid=(Math.min(...prices)+Math.max(...prices))/2,span=(Math.max(...prices)-Math.min(...prices)||1)/zoom,y0=mid-span*.55,y1=mid+span*.55,Y=p=>A.h-25-(p-y0)/(y1-y0)*(A.h-45);ctx.strokeStyle='#73c5ff';ctx.beginPath();prices.forEach((p,i)=>{const x=25+i/Math.max(1,prices.length-1)*(A.w-40);i?ctx.lineTo(x,Y(p)):ctx.moveTo(x,Y(p))});ctx.stroke();for(const c of cs){const a=Y(c.hiTick*tick),b=Y(c.loTick*tick);ctx.fillStyle='#ffc85735';ctx.fillRect(25,Math.min(a,b),A.w-40,Math.max(2,Math.abs(a-b)))}hud.textContent=`${B.meta.instrument} · ${B.meta.contract}\ntRef ${new Date(f.asOf/1e6).toISOString()}\nzonas elegibles ${f.eligible.length}\ncorredores ${cs.length}\ndominio ${f.domain[0]}..${f.domain[1]} ticks\nhash económico ${last.economicHash}\nviewport zoom ${zoom.toFixed(2)} (solo render)\nsource ${String(B.meta.source_sqlite_sha256||'').slice(0,16)}…`}function recalc(){compute();draw()}for(const id of['sigma','hmin','hmax','half','tref'])document.querySelector('#'+id).addEventListener('input',recalc);zin.onclick=()=>{zoom=Math.min(8,zoom*1.4);draw()};zout.onclick=()=>{zoom=Math.max(.5,zoom/1.4);draw()};addEventListener('resize',draw);recalc()})();</script></body></html>
