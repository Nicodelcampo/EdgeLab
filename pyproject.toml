[build-system]
requires = ["setuptools>=80,<90", "wheel>=0.45,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "edgelab"
version = "0.1.0.dev0"
description = "Market research infrastructure: shared execution, NT8 bridge and evidence"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2,<3",
  "pandas>=2.2,<4",
  "numba>=0.61,<1",
  "pydantic>=2,<3",
  "jsonschema>=4,<5",
]

[project.optional-dependencies]
bridge = ["pyarrow>=18,<30", "duckdb>=1,<2", "polars>=1,<3"]
funnel = ["pyarrow>=18,<30", "PyYAML>=6,<7"]
validation = ["scipy>=1.14,<2", "arch>=7,<10"]
dev = ["pytest>=8,<10", "hypothesis>=6,<7", "jsonschema>=4,<5", "build>=1,<2", "setuptools>=80,<90", "wheel>=0.45,<1"]
# CUDA is deliberately not in the CPU lock; match the wheel to the runtime.
gpu = ["cupy-cuda12x>=13,<16"]

[tool.setuptools.packages.find]
where = ["."]
include = ["edgelab*", "validation*"]
namespaces = true

[tool.setuptools.package-data]
"edgelab.kaggle" = ["discovery.json", "*.py.txt"]
"edgelab.bridge.indicators" = ["*.json"]
"edgelab.edge_brain" = ["schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
