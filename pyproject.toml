[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "edgelab"
version = "0.0.0"
description = "EdgeLab research/execution infrastructure (core + NT8 Indicator Bridge)"
requires-python = ">=3.12,<3.13"
# Núcleo: motor + I/O + contratos (pydantic es arquitectura central: Data/Indicator Contracts).
dependencies = [
    "numpy>=2.4.6,<2.5",
    "pandas>=3.0.3,<3.1",
    "numba>=0.66,<0.67",
    "pyarrow>=25,<26",
    "pydantic>=2.13,<3",
]

[project.optional-dependencies]
bridge = ["duckdb>=1.5,<2", "polars>=1.43,<2"]
cli = ["typer>=0.27,<1"]
dev = ["pytest>=9,<10", "hypothesis>=6,<7"]
validation = ["scipy>=1.18,<2", "arch>=8,<9"]
research-vectorbt = ["vectorbt>=1.1,<2"]

# Discovery LIMITADO al paquete `edgelab`. NO se empaqueta validation/, strategies/,
# databuild/, data/, planes, CSV ni parquets. El paquete NO se instala (editable) en
# F0B: el layout plano no permite un editable limpio (ver ENVIRONMENT.md). Las deps se
# gestionan vía lockfiles; la migración de layout es tarea futura separada.
[tool.setuptools]
packages = ["edgelab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["vectorbt: requiere el extra research-vectorbt (entorno pesado, opcional)"]
