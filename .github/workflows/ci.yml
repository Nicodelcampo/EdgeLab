name: CI

# La suite no ejecuta mediciones de research ni abre outcomes. Se particiona por
# superficie para que una regresión muestre su dominio sin ocultar la cobertura.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: pytest (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: bridge
            test_args: tests/bridge
          - name: research
            test_args: tests/research
          - name: foundation
            test_args: tests/foundation
          - name: data-external-stats
            test_args: tests/data tests/external tests/stats
          - name: top-level
            test_args: tests/test_*.py
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/core-bridge-dev.lock

      - name: Environment fingerprint
        run: |
          python -c "import sys, platform; print(sys.version); print(platform.platform())"
          pip freeze | sha256sum

      - name: Run test shard
        run: python -m pytest -q --durations=10 ${{ matrix.test_args }}
