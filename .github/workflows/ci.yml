name: CI

# Suite remota verificable. No ejecuta mediciones de research ni accede a data/.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: pytest (python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/core-bridge-dev.lock

      - name: Environment fingerprint
        run: |
          python -c "import sys, platform; print(sys.version); print(platform.platform())"
          pip freeze | sha256sum

      - name: Run test suite
        id: pytest
        shell: bash
        run: |
          set +e
          python -m pytest -q --durations=10 2>&1 | tee pytest.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish failure details on PR
        if: steps.pytest.outputs.status != '0' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const raw = fs.readFileSync('pytest.log', 'utf8');
            const tail = raw.slice(-60000);
            const marker = '<!-- edgelab-ci-pytest -->';
            const body = `${marker}\n## CI pytest failure\n\n\`\`\`text\n${tail}\n\`\`\``;
            const {owner, repo} = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {owner, repo, issue_number, per_page: 100});
            const prior = comments.find(c => c.user.type === 'Bot' && c.body.includes(marker));
            if (prior) await github.rest.issues.updateComment({owner, repo, comment_id: prior.id, body});
            else await github.rest.issues.createComment({owner, repo, issue_number, body});

      - name: Enforce pytest result
        if: steps.pytest.outputs.status != '0'
        run: exit 1
