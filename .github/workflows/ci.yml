name: CI

# Cierra P-05 (PENDIENTE.md): hasta ahora la suite corria solo en local y el
# estado verde dependia de que quien la corre lo reporte fielmente. Ahora es
# verificable desde el remoto.
#
# Este workflow NO ejecuta ninguna medicion de research: los scripts de diag/
# requieren data/ (gitignoreado, dato local) y abortan solos si no lo
# encuentran. Corre la suite de tests y nada mas.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: pytest (python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/core-bridge-dev.lock

      - name: Environment fingerprint
        run: |
          python -c "import sys, platform; print(sys.version); print(platform.platform())"
          pip freeze | sha256sum

      # pyproject.toml ya fija testpaths=["tests"] y pythonpath=["."].
      # Los tests que necesitan data/ estan marcados skip por si mismos.
      - name: Run test suite
        run: python -m pytest -q --durations=10
