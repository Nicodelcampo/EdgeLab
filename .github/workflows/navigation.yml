name: Navigation contracts (not full EdgeLab CI)
on:
  push:
    paths: ['README.md', 'AGENTS.md', 'docs/START_HERE.md', 'docs/COMPONENTS.md', 'docs/INTEGRATION_PLAN.md', 'docs/ESTADO_Y_PENDIENTES.md', 'docs/KAGGLE_START_HERE.md', 'docs/DATA_CONSUMER_MATRIX.md', 'config/repository_inventory_20261010.json', 'config/component_registry.json', 'tools/edgelab_catalog.py', 'tests/navigation/**', '.github/workflows/navigation.yml']
  pull_request:
    paths: ['README.md', 'AGENTS.md', 'docs/START_HERE.md', 'docs/COMPONENTS.md', 'docs/INTEGRATION_PLAN.md', 'docs/ESTADO_Y_PENDIENTES.md', 'docs/KAGGLE_START_HERE.md', 'docs/DATA_CONSUMER_MATRIX.md', 'config/repository_inventory_20261010.json', 'config/component_registry.json', 'tools/edgelab_catalog.py', 'tests/navigation/**', '.github/workflows/navigation.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  navigation-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/edgelab_catalog.py check --json
      - run: python -m unittest discover -s tests/navigation -v
