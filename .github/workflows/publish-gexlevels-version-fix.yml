name: Publish GexLevels version metadata fix

on:
  push:
    branches:
      - feat/edge-discovery-brain-foundation-20260919
    paths:
      - .github/workflows/publish-gexlevels-version-fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-test-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/edge-discovery-brain-foundation-20260919
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install canonical bridge dependencies
        run: python -m pip install -r requirements/core-bridge-dev.lock
      - name: Add versioned metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('nt8/GexLevels.cs')
          text = path.read_text(encoding='utf-8-sig')
          assert 'version=' not in text
          path.write_text('// # meta indicator=GexLevels,version=1.0\n' + text, encoding='utf-8')
          PY
      - name: Validate isolated metadata contract
        run: |
          python -m pytest -q 'tests/bridge/test_ulp_sweep.py::test_cada_cs_declara_version_en_el_meta[GexLevels.cs]'
          git diff --check
          test "$(git diff --name-only)" = "nt8/GexLevels.cs"
      - name: Commit isolated repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nt8/GexLevels.cs
          git commit -m 'fix(nt8): version GexLevels metadata'
          git push origin HEAD:feat/edge-discovery-brain-foundation-20260919
