name: aVolClusterPOI NQ zone-store contract

on:
  push:
    branches:
      - research/avolcluster-nq-gate1-infra-v1-20260828
    paths:
      - 'edgelab/research/event_store_contract.py'
      - 'edgelab/research/avolcluster_nq_zone_store.py'
      - 'tools/validate_avolcluster_nq_zone_store.py'
      - 'specs/avolcluster_nq_zone_event_store_v1.json'
      - 'tests/research/test_event_store_contract.py'
      - 'tests/research/test_avolcluster_nq_zone_store.py'
      - '.github/workflows/contract_avolcluster_nq_zone_store.yml'
  pull_request:
    paths:
      - 'edgelab/research/event_store_contract.py'
      - 'edgelab/research/avolcluster_nq_zone_store.py'
      - 'tools/validate_avolcluster_nq_zone_store.py'
      - 'specs/avolcluster_nq_zone_event_store_v1.json'
      - 'tests/research/test_event_store_contract.py'
      - 'tests/research/test_avolcluster_nq_zone_store.py'
      - '.github/workflows/contract_avolcluster_nq_zone_store.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contract-avolcluster-nq-zone-store-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install locked environment
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/core-bridge-dev.lock
      - name: Run fail-closed contract tests
        run: |
          python -m pytest -q \
            tests/research/test_event_store_contract.py \
            tests/research/test_avolcluster_nq_zone_store.py
      - name: Draft preflight must not open paths
        run: |
          python tools/validate_avolcluster_nq_zone_store.py \
            --preflight-only \
            --expected-commit "${GITHUB_SHA}" \
            --output-json /tmp/avolcluster_nq_zone_store_preflight.json
