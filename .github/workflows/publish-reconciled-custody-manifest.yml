name: Publish reconciled custody manifest

on:
  push:
    branches:
      - audit/edge-discovery-factory-foundation-20260919
    paths:
      - .github/workflows/publish-reconciled-custody-manifest.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/edge-discovery-factory-foundation-20260919
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused test dependency
        run: python -m pip install pytest
      - name: Generate and validate custody manifest
        run: |
          python tools/rectify_kaggle_manifest.py
          python -m pytest -q tests/test_kaggle_manifest_reconciliation.py
          git diff --check
          test "$(git diff --name-only)" = "artifacts/audit/EDGELAB_KAGGLE_CANONICAL_MANIFEST.json"
      - name: Commit generated custody output
        run: |
          if git diff --quiet -- artifacts/audit/EDGELAB_KAGGLE_CANONICAL_MANIFEST.json; then
            echo 'Manifest already reconciled.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/audit/EDGELAB_KAGGLE_CANONICAL_MANIFEST.json
          git commit -m 'audit(custody): publish reconciled canonical manifest'
          git push origin HEAD:audit/edge-discovery-factory-foundation-20260919
