name: G2-A1 validation

on:
  pull_request:
    branches: [foundation/f0b-compatibility-probe]
    paths:
      - ".github/workflows/g2-a1-validation.yml"
      - "edgelab/research/g2.py"
      - "edgelab/research/g2_decision.py"
      - "edgelab/research/g2_ratio.py"
      - "edgelab/research/promotion.py"
      - "edgelab/stats/**"
      - "tests/research/test_g2*.py"
      - "tests/research/test_promotion.py"
      - "tests/stats/**"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: g2-a1-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  targeted-g2:
    name: Targeted G2-A1 tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install minimal test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pytest>=9,<10" "numpy>=2.4.6,<2.5"
      - name: Compile changed modules
        run: |
          python -m compileall -q edgelab/research/g2.py edgelab/research/g2_decision.py edgelab/research/g2_ratio.py edgelab/research/promotion.py edgelab/stats
      - name: Run targeted suite
        run: |
          python -m pytest tests/research/test_g2.py tests/research/test_g2_dsr_calibration.py tests/research/test_g2_decision.py tests/research/test_g2_ratio.py tests/research/test_promotion.py tests/stats/test_cluster_estimand.py -q
      - name: Publish synthetic calibration
        run: |
          python tests/research/test_g2_dsr_calibration.py | tee g2-dsr-calibration.json
          {
            echo "### G2 DSR-HAC synthetic calibration"
            echo '```json'
            cat g2-dsr-calibration.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  differential-suite:
    name: Full-suite differential vs base
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout PR merge result
        uses: actions/checkout@v4
      - name: Checkout canonical base
        uses: actions/checkout@v4
        with:
          ref: foundation/f0b-compatibility-probe
          path: _baseline
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Build matching repository-local environments
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e ".[dev,validation,bridge]"
          python -m venv _baseline/.venv
          _baseline/.venv/bin/python -m pip install --upgrade pip
          _baseline/.venv/bin/python -m pip install -e "./_baseline[dev,validation,bridge]"
      - name: Run head and base suites
        shell: bash
        run: |
          set +e
          .venv/bin/python -m pytest -q --junitxml=head-suite.xml 2>&1 | tee head-suite.log
          echo "${PIPESTATUS[0]}" > head-exit.txt
          cd _baseline
          .venv/bin/python -m pytest -q --junitxml=../base-suite.xml 2>&1 | tee ../base-suite.log
          echo "${PIPESTATUS[0]}" > ../base-exit.txt
          exit 0
      - name: Compare failing test identities
        id: compare
        shell: bash
        run: |
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          def failures(path):
              file = Path(path)
              if not file.exists():
                  return {"__missing_junit__"}
              root = ET.parse(file).getroot()
              return {
                  f"{case.get('classname', '')}::{case.get('name', '')}"
                  for case in root.iter("testcase")
                  if case.find("failure") is not None or case.find("error") is not None
              }

          head = failures("head-suite.xml")
          base = failures("base-suite.xml")
          new = sorted(head - base)
          resolved = sorted(base - head)
          values = {
              "head_exit": Path("head-exit.txt").read_text().strip(),
              "base_exit": Path("base-exit.txt").read_text().strip(),
              "head_failures": len(head),
              "base_failures": len(base),
              "new_failures": len(new),
              "resolved_failures": len(resolved),
              "regression": str(bool(new)).lower(),
          }
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as stream:
              for key, value in values.items():
                  stream.write(f"{key}={value}\n")
          Path("new-failures.txt").write_text("\n".join(new), encoding="utf-8")
          Path("resolved-failures.txt").write_text("\n".join(resolved), encoding="utf-8")
          PY
      - name: Publish differential diagnostic
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_EXIT: ${{ steps.compare.outputs.head_exit }}
          BASE_EXIT: ${{ steps.compare.outputs.base_exit }}
          HEAD_FAILURES: ${{ steps.compare.outputs.head_failures }}
          BASE_FAILURES: ${{ steps.compare.outputs.base_failures }}
          NEW_FAILURES: ${{ steps.compare.outputs.new_failures }}
          RESOLVED_FAILURES: ${{ steps.compare.outputs.resolved_failures }}
          REGRESSION: ${{ steps.compare.outputs.regression }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          verdict = "FAIL — nuevas regresiones" if os.environ.get("REGRESSION") == "true" else "PASS diferencial — sin fallos nuevos"
          new = Path("new-failures.txt").read_text(encoding="utf-8") or "(ninguno)"
          resolved = Path("resolved-failures.txt").read_text(encoding="utf-8") or "(ninguno)"
          body = f"""<!-- g2-a1-differential -->
          ## G2-A1 full-suite: {verdict}

          | Métrica | PR | Base |
          |---|---:|---:|
          | exit code | {os.environ.get('HEAD_EXIT')} | {os.environ.get('BASE_EXIT')} |
          | tests fallidos/error | {os.environ.get('HEAD_FAILURES')} | {os.environ.get('BASE_FAILURES')} |

          **Fallos nuevos:** {os.environ.get('NEW_FAILURES')}  
          **Fallos resueltos:** {os.environ.get('RESOLVED_FAILURES')}

          <details><summary>Identidades nuevas</summary>

          ```text
          {new}
          ```
          </details>

          <details><summary>Identidades resueltas</summary>

          ```text
          {resolved}
          ```
          </details>
          """
          Path("differential-comment.md").write_text(body, encoding="utf-8")
          PY
          gh pr comment "${PR_NUMBER}" --body-file differential-comment.md
      - name: Enforce no new failures
        if: steps.compare.outputs.regression == 'true'
        run: exit 1
