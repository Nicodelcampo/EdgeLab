name: G2-A1 targeted diagnostic

on:
  pull_request:
    branches: [foundation/f0b-compatibility-probe]
    paths:
      - ".github/workflows/g2-a1-diagnostic.yml"
      - "edgelab/research/g2_dsr.py"
      - "edgelab/research/g2_protocol.py"
      - "edgelab/research/g2_decision.py"
      - "edgelab/research/promotion.py"
      - "tests/research/test_g2*.py"
      - "tests/research/test_promotion.py"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: g2-a1-diagnostic-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  targeted-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pytest>=9,<10" "numpy>=2.4.6,<2.5"
      - name: Run targeted suite and retain output
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python -m pytest \
            tests/research/test_g2.py \
            tests/research/test_g2_dsr_calibration.py \
            tests/research/test_g2_protocol.py \
            tests/research/test_g2_decision.py \
            tests/research/test_g2_ratio.py \
            tests/research/test_promotion.py \
            tests/stats/test_cluster_estimand.py -q 2>&1 | tee targeted.log
      - name: Publish diagnostic
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          OUTCOME: ${{ steps.tests.outcome }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          lines = Path("targeted.log").read_text(encoding="utf-8").splitlines()
          tail = "\n".join(lines[-250:])
          body = f"""<!-- g2-a1-targeted-diagnostic -->
          ## G2-A1 targeted diagnostic: {os.environ['OUTCOME']}

          ```text
          {tail}
          ```
          """
          Path("diagnostic-comment.md").write_text(body, encoding="utf-8")
          PY
          gh pr comment "${PR_NUMBER}" --body-file diagnostic-comment.md
      - name: Enforce targeted result
        if: steps.tests.outcome != 'success'
        run: exit 1
