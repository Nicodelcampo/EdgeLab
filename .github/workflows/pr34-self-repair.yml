name: PR34 provenance self-repair
on:
  push:
    branches: [fix/hft-native-termination-fresh-replay-20260918]
    paths:
      - tools/_apply_pr34_provenance_repair.py
      - .github/workflows/pr34-self-repair.yml
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/hft-native-termination-fresh-replay-20260918
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/_apply_pr34_provenance_repair.py
      - run: pip install pytest && pytest -q tests/bridge/test_paridad_hftzones_v2.py tests/bridge/test_hft_parity_provenance.py tests/bridge/test_hft_v2_certification_hardening.py
      - run: rm tools/_apply_pr34_provenance_repair.py .github/workflows/pr34-self-repair.yml
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(hft): abstain until native replay provenance is verified'
          git push origin HEAD:fix/hft-native-termination-fresh-replay-20260918
