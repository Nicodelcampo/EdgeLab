name: YM pre-range session window

on:
  pull_request:
    branches: [foundation/f0b-compatibility-probe]
    paths:
      - ".github/workflows/ym-prerange-session-window.yml"
      - "edgelab/sessions.py"
      - "tests/test_sessions.py"
      - "docs/research/H-SWEEP-1_YM_PRERANGE.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ym-prerange-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  targeted:
    name: Session-window tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pytest>=9,<10" "numpy>=2.4.6,<2.5" "pandas>=3.0.3,<3.1"
      - name: Compile and test
        run: |
          python -m compileall -q edgelab/sessions.py
          python -m pytest tests/test_sessions.py -q
