name: BT2A P2-A GC clock heterogeneity contract

on:
  pull_request:
    paths:
      - "edgelab/research/bt2a_clock_heterogeneity.py"
      - "specs/bt2a_p2a_gc_clock_heterogeneity_v1.json"
      - "specs/bt2a_macro_calendar_gc_20250804_20260630_v1.json"
      - "tools/run_bt2a_p2a_gc_clock_heterogeneity.py"
      - "tests/research/test_bt2a_p2a_gc_clock_heterogeneity.py"
      - ".github/workflows/bt2a-p2a-clock-heterogeneity.yml"
  workflow_dispatch:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements/core-bridge-dev.lock
      - name: Focused scientific and firewall tests
        run: >-
          python -m pytest -q
          tests/research/test_bt2a_gate2_first_passage.py
          tests/research/test_bt2a_p2a_gc_clock_heterogeneity.py
