name: G2-A1 calibration hardening

on:
  pull_request:
    branches: [foundation/f0b-compatibility-probe]
    paths:
      - ".github/workflows/g2-a1-hardening.yml"
      - "edgelab/research/g2_dsr.py"
      - "edgelab/research/g2_protocol.py"
      - "tests/research/test_g2_dsr_calibration.py"
      - "tests/research/test_g2_protocol.py"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: g2-a1-hardening-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  targeted:
    name: Calibrated DSR and protocol tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install minimal dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pytest>=9,<10" "numpy>=2.4.6,<2.5"
      - name: Compile and test
        run: |
          python -m compileall -q edgelab/research/g2_dsr.py edgelab/research/g2_protocol.py
          python -m pytest tests/research/test_g2_dsr_calibration.py tests/research/test_g2_protocol.py tests/research/test_g2_ratio.py -q
      - name: Calibration report
        run: |
          python tests/research/test_g2_dsr_calibration.py | tee g2-dsr-calibration.json
          {
            echo "### G2 DSR-HAC synthetic calibration"
            echo '```json'
            cat g2-dsr-calibration.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
