name: G2-A1 calibration hardening

on:
  pull_request:
    branches: [foundation/f0b-compatibility-probe]
    paths:
      - ".github/workflows/g2-a1-hardening.yml"
      - "docs/edge_validation_contract.md"
      - "docs/amendments/G2-A1-2026-08-10_semantica_estadistica.md"
      - "edgelab/research/g2.py"
      - "edgelab/research/g2_dsr.py"
      - "edgelab/research/g2_protocol.py"
      - "edgelab/research/g2_decision.py"
      - "edgelab/research/g2_ratio.py"
      - "edgelab/research/promotion.py"
      - "edgelab/stats/**"
      - "tests/research/test_g2*.py"
      - "tests/research/test_promotion.py"
      - "tests/stats/**"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g2-a1-hardening-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  targeted:
    name: Targeted G2-A1 hardening tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install minimal dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pytest>=9,<10" "numpy>=2.4.6,<2.5"
      - name: Compile changed modules
        run: |
          python -m compileall -q \
            edgelab/research/g2.py \
            edgelab/research/g2_dsr.py \
            edgelab/research/g2_protocol.py \
            edgelab/research/g2_decision.py \
            edgelab/research/g2_ratio.py \
            edgelab/research/promotion.py \
            edgelab/stats
      - name: Run targeted suite
        run: |
          python -m pytest \
            tests/research/test_g2.py \
            tests/research/test_g2_dsr_calibration.py \
            tests/research/test_g2_protocol.py \
            tests/research/test_g2_decision.py \
            tests/research/test_g2_ratio.py \
            tests/research/test_promotion.py \
            tests/stats/test_cluster_estimand.py -q
      - name: Generate calibration evidence
        run: |
          python tests/research/test_g2_dsr_calibration.py | tee g2-dsr-calibration.json
          {
            echo "### G2 DSR-HAC synthetic calibration"
            echo '```json'
            cat g2-dsr-calibration.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  differential:
    name: Full-suite differential vs base
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout PR merge result
        uses: actions/checkout@v4
      - name: Checkout canonical base
        uses: actions/checkout@v4
        with:
          ref: foundation/f0b-compatibility-probe
          path: _baseline
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Build matching repository-local environments
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e ".[dev,validation,bridge]"
          python -m venv _baseline/.venv
          _baseline/.venv/bin/python -m pip install --upgrade pip
          _baseline/.venv/bin/python -m pip install -e "./_baseline[dev,validation,bridge]"
      - name: Run head and base suites
        shell: bash
        run: |
          set +e
          .venv/bin/python -m pytest -q --junitxml=head-suite.xml 2>&1 | tee head-suite.log
          echo "${PIPESTATUS[0]}" > head-exit.txt
          cd _baseline
          .venv/bin/python -m pytest -q --junitxml=../base-suite.xml 2>&1 | tee ../base-suite.log
          echo "${PIPESTATUS[0]}" > ../base-exit.txt
          exit 0
      - name: Compare failing test identities
        id: compare
        shell: bash
        run: |
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          def failures(path):
              file = Path(path)
              if not file.exists():
                  return {"__missing_junit__"}
              root = ET.parse(file).getroot()
              return {
                  f"{case.get('classname', '')}::{case.get('name', '')}"
                  for case in root.iter("testcase")
                  if case.find("failure") is not None or case.find("error") is not None
              }

          head = failures("head-suite.xml")
          base = failures("base-suite.xml")
          new = sorted(head - base)
          resolved = sorted(base - head)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as stream:
              stream.write("regression=%s\n" % str(bool(new)).lower())
              stream.write("head_failures=%d\n" % len(head))
              stream.write("base_failures=%d\n" % len(base))
          summary = [
              "### Full-suite differential",
              "",
              "- Head failures/errors: `%d`" % len(head),
              "- Base failures/errors: `%d`" % len(base),
              "- New failures: `%d`" % len(new),
              "- Resolved failures: `%d`" % len(resolved),
              "",
              "#### New identities",
              "```text",
              *(new or ["(none)"]),
              "```",
              "#### Resolved identities",
              "```text",
              *(resolved or ["(none)"]),
              "```",
          ]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as stream:
              stream.write("\n".join(summary) + "\n")
          PY
      - name: Enforce no new failures
        if: steps.compare.outputs.regression == 'true'
        run: exit 1
