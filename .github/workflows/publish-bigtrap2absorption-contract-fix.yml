name: Publish BigTrap2Absorption contract fix

on:
  push:
    branches:
      - feat/edge-discovery-brain-foundation-20260919
    paths:
      - .github/workflows/publish-bigtrap2absorption-contract-fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-test-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/edge-discovery-brain-foundation-20260919
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install canonical bridge dependencies
        run: python -m pip install -r requirements/core-bridge-dev.lock
      - name: Apply reviewed patch
        run: git apply --whitespace=nowarn .github/patches/bigtrap2absorption-contract.patch
      - name: Validate focused contract
        run: python -m pytest -q tests/bridge/test_bigtrap2absorption_store_contract.py tests/bridge/test_store_v2.py
      - name: Validate bridge regression envelope
        shell: bash
        run: |
          set +e
          python -m pytest -q tests/bridge > /tmp/bridge.txt 2>&1
          rc=$?
          set -e
          cat /tmp/bridge.txt
          test "$rc" -eq 1
          grep -q 'test_todo_candidato_actual_esta_triajeado' /tmp/bridge.txt
          grep -q 'test_cada_cs_declara_version_en_el_meta\[GexLevels.cs\]' /tmp/bridge.txt
          grep -q '2 failed, 558 passed, 31 skipped, 2 xfailed' /tmp/bridge.txt
      - name: Check isolated diff
        run: |
          git config core.whitespace cr-at-eol
          git diff --check
          test "$(git diff --name-only | sort)" = "$(printf '%s\n' edgelab/bridge/indicators/bigtrap2absorption.py edgelab/bridge/oracle.py tests/bridge/test_bigtrap2absorption_store_contract.py | sort)"
      - name: Commit isolated repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add edgelab/bridge/indicators/bigtrap2absorption.py edgelab/bridge/oracle.py tests/bridge/test_bigtrap2absorption_store_contract.py
          git commit -m 'fix(bridge): restore BigTrap2Absorption event contract'
          git push origin HEAD:feat/edge-discovery-brain-foundation-20260919
