name: LUX-IMB geometry contract

on:
  pull_request:
    branches: [foundation/f0b-compatibility-probe]
    paths:
      - ".github/workflows/lux-imb-geometry.yml"
      - "edgelab/research/lux_imb.py"
      - "tests/research/test_lux_imb.py"
      - "docs/research/H-COND-1_LUX-IMB_PROTOCOLO.md"
      - "docs/research/LUX_*.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  targeted:
    name: LUX OG/VI geometry tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install test dependency
        run: python -m pip install "pytest>=9,<10"
      - name: Compile and test
        run: |
          python -m compileall -q edgelab/research/lux_imb.py
          python -m pytest tests/research/test_lux_imb.py -q
