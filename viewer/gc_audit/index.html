<html lang="es">

<title>Visor BigTrap2Absorption — GC 12-26 Paridad</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin:0; background:#0b0e14; color:#c9d1d9; font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; display:flex; flex-direction:column; height:100vh; overflow:hidden; }
  header { padding:10px 16px; background:#11151d; border-bottom:1px solid #232a37; display:flex; justify-content:space-between; align-items:center; }
  .title { font-size:15px; font-weight:700; color:#e6edf3; display:flex; align-items:center; gap:8px; }
  .badge { background:#1e3a5f; color:#58a6ff; font-size:11px; padding:2px 8px; border-radius:12px; font-weight:600; border:1px solid #3b82f6; }
  .badge-pass { background:#1e4620; color:#3fb950; border:1px solid #2ea043; }
  .stats-bar { display:flex; gap:16px; font-size:12px; }
  .stat-item { background:#161b25; padding:4px 10px; border-radius:6px; border:1px solid #232a37; }
  .stat-item b { color:#fff; }
  
  #main { display:grid; grid-template-columns: 1fr 420px; flex:1; min-height:0; }
  #chart-container { position:relative; width:100%; height:100%; }
  #chart { width:100%; height:100%; }
  
  #sidebar { background:#11151d; border-left:1px solid #232a37; display:flex; flex-direction:column; min-height:0; }
  .sidebar-header { padding:10px 14px; background:#161b25; border-bottom:1px solid #232a37; font-weight:600; color:#e6edf3; display:flex; justify-content:space-between; align-items:center; }
  .filters { padding:8px 12px; display:flex; gap:8px; background:#0e1219; border-bottom:1px solid #232a37; }
  .filter-btn { background:#1c2230; color:#c9d1d9; border:1px solid #2d3547; padding:4px 10px; border-radius:4px; cursor:pointer; font-size:11px; }
  .filter-btn.active { background:#3b82f6; color:#fff; border-color:#3b82f6; font-weight:600; }
  
  #zone-table-container { flex:1; overflow-y:auto; }
  table { width:100%; border-collapse:collapse; font-size:12px; }
  th { background:#161b25; color:#8b95a5; position:sticky; top:0; padding:6px 8px; text-align:left; border-bottom:1px solid #232a37; font-size:11px; }
  td { padding:6px 8px; border-bottom:1px solid #1c2230; font-family:ui-monospace,SFMono-Regular,Consolas,monospace; font-size:11px; }
  tr.zone-row { cursor:pointer; transition:background .1s; }
  tr.zone-row:hover { background:#1c2531; }
  tr.zone-row.selected { background:#1e3a5f !important; border-left:3px solid #3b82f6; }
  
  .tag-bull { color:#3fb950; font-weight:600; }
  .tag-bear { color:#f85149; font-weight:600; }
  
  #tooltip { position:absolute; display:none; background:rgba(17,21,29,.92); border:1px solid #3b82f6; padding:8px 12px; border-radius:6px; font-size:11px; pointer-events:none; z-index:100; box-shadow:0 4px 12px rgba(0,0,0,.5); }

let chart, candleSeries;
let currentFilter = 'ALL';
let markers = [];

function initChart() {
  const container = document.getElementById('chart');
  chart = LightweightCharts.createChart(container, {
    layout: {
      backgroundColor: '#0b0e14',
      textColor: '#8b95a5',
    },
    grid: {
      vertLines: { color: '#161b25' },
      horzLines: { color: '#161b25' },
    },
    crosshair: {
      mode: LightweightCharts.CrosshairMode.Normal,
    },
    priceScale: {
      borderColor: '#232a37',
    },
    timeScale: {
      borderColor: '#232a37',
      timeVisible: true,
      secondsVisible: false,
    },
  });

  candleSeries = chart.addCandlestickSeries({
    upColor: '#26a69a',
    downColor: '#ef5350',
    borderVisible: false,
    wickUpColor: '#26a69a',
    wickDownColor: '#ef5350',
  });

  candleSeries.setData(DATA.candles);

  // Build markers for zones and fills
  DATA.zones.forEach(z => {
    const isBull = z.side === 'trapped_buyers';
    markers.push({
      time: z.time,
      position: isBull ? 'aboveBar' : 'belowBar',
      color: isBull ? '#00e676' : '#ff5252',
      shape: isBull ? 'arrowDown' : 'arrowUp',
      text: `${isBull ? 'ABS-BUY' : 'ABS-SELL'} ${z.lo.toFixed(1)}-${z.hi.toFixed(1)} (A:${z.a_score.toFixed(1)})`,
      id: z.zone_id
    });
  });

  markers.sort((a,b) => a.time - b.time);
  candleSeries.setMarkers(markers);

  renderTable();

  window.addEventListener('resize', () => {
    chart.applyOptions({ width: container.clientWidth, height: container.clientHeight });
  });
}

function renderTable() {
  const tbody = document.getElementById('zone-tbody');
  tbody.innerHTML = '';
  
  const filtered = DATA.zones.filter(z => {
    if (currentFilter === 'ALL') return true;
    if (currentFilter === 'BUYERS') return z.side === 'trapped_buyers';
    if (currentFilter === 'SELLERS') return z.side === 'trapped_sellers';
    return true;
  });

  filtered.forEach(z => {
    const tr = document.createElement('tr');
    tr.className = 'zone-row';
    const isBull = z.side === 'trapped_buyers';
    const tFormatted = z.time_str.split(' ')[1].substring(0,8);
    
    tr.innerHTML = `
      <td>${tFormatted}</td>
      <td class="${isBull ? 'tag-bull' : 'tag-bear'}">${isBull ? 'BUY TRAP' : 'SELL TRAP'}</td>
      <td><b>${z.lo.toFixed(1)}</b> - <b>${z.hi.toFixed(1)}</b></td>
      <td>${z.a_score.toFixed(1)} / ${z.a_thr.toFixed(1)}</td>
      <td>${z.vol} (${(z.frac*100).toFixed(0)}%)</td>
    `;

    tr.onclick = () => focusZone(z, tr);
    tbody.appendChild(tr);
  });
}

function filterZones(f) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.classList.toggle('active', btn.innerText.includes(f) || (f==='ALL' && btn.innerText.includes('TODAS')));
  });
  renderTable();
}

function focusZone(z, tr) {
  document.querySelectorAll('tr.zone-row').forEach(r => r.classList.remove('selected'));
  tr.classList.add('selected');

  // Center chart on zone time
  chart.timeScale().setVisibleRange({
    from: z.time - 3600 * 2,
    to: z.time + 3600 * 2
  });
}

window.onload = initChart;
</script>
