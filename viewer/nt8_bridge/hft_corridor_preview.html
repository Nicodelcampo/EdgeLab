<!doctype html><html lang="es"><head><meta charset="utf-8"><title>EdgeLab · HFT Corridor Review</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body{margin:0;height:100%;background:#10151d;color:#dce4ee;font:13px Segoe UI,Arial}header{height:44px;display:flex;align-items:center;gap:10px;padding:0 14px;background:#19212c;border-bottom:1px solid #344050}select,input,button{background:#222d3b;color:#e8eef6;border:1px solid #526075;border-radius:4px;padding:5px 8px}.warn{color:#ffca58;font-weight:700}.grow{flex:1}#wrap{height:calc(100% - 45px);display:grid;grid-template-columns:5fr 1.25fr;position:relative}canvas{width:100%;height:100%}#profile{border-left:1px solid #344050}.hud{position:absolute;left:12px;top:10px;background:#111923dd;border:1px solid #435064;padding:8px 10px;white-space:pre;z-index:2;font:12px Consolas,monospace}.empty{padding:40px;font-size:16px}</style></head><body><header><a href="index.html" id="btn-back-chart" style="color:#dce4ee;background:#222d3b;border:1px solid #526075;border-radius:4px;padding:4px 8px;text-decoration:none;font-weight:600;display:inline-flex;align-items:center;gap:4px;font-size:12px;">← Chart NT8</a><b>HFTZonesNQ → campo causal</b><span class="warn">PROVISIONAL · NO EDGE · NO OUTCOMES</span><label>Config <select id="cfg"></select></label><label>tRef <input id="tref" type="range" min="0" max="1000" value="650"></label><button id="zin">Zoom precio +</button><button id="zout">Zoom precio −</button><span class="grow"></span><span id="status"></span></header><div id="wrap"><canvas id="chart"></canvas><canvas id="profile"></canvas><div class="hud" id="hud"></div></div><script src="hft_nq_bundle.js"></script><script>(()=>{'use strict';const B=window.HFT_NQ_CORRIDOR_BUNDLE,cfgEl=document.querySelector('#cfg'),tEl=document.querySelector('#tref'),hud=document.querySelector('#hud'),status=document.querySelector('#status');if(!B){document.querySelector('#wrap').innerHTML='<div class="empty">Falta hft_nq_bundle.js. Ejecutá tools/build_hft_corridor_bundle.py.</div>';return}for(const c of B.configurations){const o=document.createElement('option');o.value=c.id;o.textContent=c.id;cfgEl.appendChild(o)}cfgEl.value='HFT_RAW_GAUSS_2';let zoom=1;function median(a){const x=[...a].sort((a,b)=>a-b),n=x.length;return n?(n%2?x[(n-1)/2]:(x[n/2-1]+x[n/2])/2):100}function field(){const c=B.configurations.find(x=>x.id===cfgEl.value),times=B.candles.map(x=>x.time_ns),i=Math.min(times.length-1,Math.floor((+tEl.value/1000)*(times.length-1))),t=times[i],candles=B.candles.slice(0,i+1),zones=B.zones.filter(z=>+z.available_ts<=t).sort((a,b)=>(+a.available_ts-+b.available_ts)||String(a.id).localeCompare(String(b.id))),tick=B.meta.tick_size,vals=candles.map(x=>Math.round(+x.price/tick));for(const z of zones)vals.push(Math.round(+z.lo/tick),Math.round(+z.hi/tick));const p0=Math.min(...vals)-20,p1=Math.max(...vals)+20,d=new Float64Array(p1-p0+1),vref=median(zones.map(z=>+z.vol||1).slice(-500));for(const z of zones){let w=1;if(c.model!=='FIELD_RAW_STATIC'){const r=Math.max(1,+z.vol||1)/Math.max(1,vref);w=c.vol_transform==='TRANS_LOG'?Math.log2(1+r):Math.pow(r,.25)}const lo=Math.round(+z.lo/tick),hi=Math.round(+z.hi/tick);if(c.kernel==='KERNEL_BOX'){for(let k=Math.max(p0,lo);k<=Math.min(p1,hi);k++)d[k-p0]+=w}else{const s=Math.max(.1,+c.sigma_ticks),cut=Math.ceil(3*s);for(let k=Math.max(p0,lo-cut);k<=Math.min(p1,hi+cut);k++){const q=k<lo?lo-k:k>hi?k-hi:0;if(q<=3*s)d[k-p0]+=w*(q===0?1:Math.exp(-(q*q)/(2*s*s)))}}}return{c,t,candles,zones,p0,p1,d,tick,vref}}function fit(canvas){const r=canvas.getBoundingClientRect(),q=devicePixelRatio||1;canvas.width=r.width*q;canvas.height=r.height*q;const x=canvas.getContext('2d');x.setTransform(q,0,0,q,0,0);return{x,w:r.width,h:r.height}}async function hash(f){const raw=JSON.stringify({p0:f.p0,p1:f.p1,t:f.t,cfg:f.c.id,d:Array.from(f.d,x=>+x.toFixed(8)),zones:f.zones.map(z=>z.id)}),b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(raw));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}async function draw(){const f=field(),A=fit(document.querySelector('#chart')),P=fit(document.querySelector('#profile'));for(const q of[A,P]){q.x.fillStyle='#10151d';q.x.fillRect(0,0,q.w,q.h)}const prices=f.candles.map(x=>+x.price),mid=(Math.min(...prices)+Math.max(...prices))/2,span=(Math.max(...prices)-Math.min(...prices)||1)/zoom,ymin=mid-span*.55,ymax=mid+span*.55,X=j=>30+j/Math.max(1,f.candles.length-1)*(A.w-45),Y=p=>A.h-25-(p-ymin)/(ymax-ymin)*(A.h-45);A.x.strokeStyle='#7bc4ff';A.x.beginPath();f.candles.forEach((q,j)=>j?A.x.lineTo(X(j),Y(+q.price)):A.x.moveTo(X(j),Y(+q.price)));A.x.stroke();for(const z of f.zones){const y1=Y(+z.hi),y2=Y(+z.lo);if(Math.max(y1,y2)<0||Math.min(y1,y2)>A.h)continue;A.x.fillStyle=(+z.direction>=0?'#ff8a4c33':'#45d18a33');A.x.fillRect(30,Math.min(y1,y2),A.w-45,Math.max(2,Math.abs(y2-y1)))}const max=Math.max(1,...f.d),PY=k=>P.h-25-((k*f.tick-ymin)/(ymax-ymin))*(P.h-45);P.x.fillStyle='#4db8ff88';for(let k=f.p0;k<=f.p1;k++){const y=PY(k);if(y>=0&&y<=P.h)P.x.fillRect(0,y,(f.d[k-f.p0]/max)*(P.w-8),2)}const h=(await hash(f)).slice(0,16);hud.textContent=`${B.meta.asset} ${B.meta.contract}\ntRef: ${new Date(f.t/1e6).toISOString()}\nconfig: ${f.c.id}\nzonas disponibles: ${f.zones.length}\nVref causal N=${Math.min(500,f.zones.length)}: ${f.vref.toFixed(2)}\ndominio fijo: ${f.p0}..${f.p1} ticks\nfield hash: ${h}`;status.textContent=B.meta.parity_status;status.className='warn';window.__HFT_CORRIDOR_STATE__={...f,field_hash:h,zoom}}for(const e of[cfgEl,tEl])e.addEventListener('input',draw);document.querySelector('#zin').onclick=()=>{zoom=Math.min(8,zoom*1.4);draw()};document.querySelector('#zout').onclick=()=>{zoom=Math.max(.5,zoom/1.4);draw()};addEventListener('resize',draw);draw()})();</script></body></html>
